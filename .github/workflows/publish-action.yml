name: 🔑 Key Chest Publisher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "🎮 Level to publish (e.g., 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  publish-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: 🧱 Enter the Pipe (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🎯 Check the Level Number (Validate version input)
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Oh no! '$VERSION' is not a valid level! Use MAJOR.MINOR.PATCH without the 'v' prefix (e.g., 1.0.0)."
            exit 1
          fi
          echo "✅ Level $VERSION looks good!"

      - name: 🔍 Check if Already Published
        id: version-check
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "⚠️ Version v$VERSION already exists! Re-verifying it and moving the major tag only."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Version v$VERSION is new!"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🕹️ Warp to the Existing Level (Checkout version tag)
        if: steps.version-check.outputs.should_publish == 'false'
        run: |
          echo "🕹️ Warping to existing level v$VERSION"
          git checkout --detach "refs/tags/v$VERSION"

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🍄 Grab a Mushroom (Setup Node.js)
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: 📦 Open the ? Block (Install packages)
        run: pnpm install --frozen-lockfile

      - name: 🔎 Inspect the Existing Castle (Verify tagged bundle is fresh)
        if: steps.version-check.outputs.should_publish == 'false'
        run: |
          pnpm verify:gha
          echo "✅ Bundle at v$VERSION is up to date!"

      - name: 🏗️ Build the Castle
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm build:gha

      - name: 🔍 Check for Hidden Blocks (Verify build)
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          if [ ! -f "github-action/dist/index.js" ]; then
            echo "❌ Oh no! Mario fell into a pit! Build failed!"
            exit 1
          fi
          echo "✅ Yahoo! Build successful! 🎉"

      - name: 📝 Commit Built Files
        if: steps.version-check.outputs.should_publish == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f github-action/dist/index.js

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "build: update compiled files for v$VERSION"
            git push origin "HEAD:$REF_NAME"
          fi

      - name: 🏁 Place the Flagpole (Create version tag)
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          echo "🏁 Creating tag v$VERSION!"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: ⭐ Collect the Star (Update major tag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MAJOR_VERSION=$(echo "v$VERSION" | cut -d. -f1)
          TARGET_COMMIT=$(git rev-parse "refs/tags/v$VERSION^{commit}")

          echo "⭐ Collecting star power! Updating $MAJOR_VERSION to v$VERSION ($TARGET_COMMIT)"

          git tag -fa "$MAJOR_VERSION" "$TARGET_COMMIT" -m "⭐ Power-up $MAJOR_VERSION now at v$VERSION"
          git push origin "refs/tags/$MAJOR_VERSION" --force
          echo "🌟 Star collected! $MAJOR_VERSION is now super-charged!"

      - name: 🏰 Unlock the Castle (Create Release)
        if: steps.version-check.outputs.should_publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ inputs.version }}"
          name: "🔑 Secret Key Level v${{ inputs.version }}"
          body: |
            ## 🔑 Envilder GitHub Action - Level v${{ inputs.version }}

            🎮 **New power-up unlocked!** Pull secrets from AWS SSM like collecting coins! 🪙

            ### 🍄 How to use this power-up

            ```yaml
            - uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                aws-region: us-east-1

            - uses: macalbert/envilder/github-action@v${{ inputs.version }}
              with:
                map-file: envilder.json
                env-file: .env
            ```

            📖 Check the [manual](https://github.com/macalbert/envilder/blob/main/docs/github-action.md) to master this level!

            🎊 **Let's-a-go!**
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
