name: 🧪 Test Try Blocks

permissions:
  contents: read

# Fails when a test (Vitest `it`/`test`, xUnit `[Fact]`/`[Theory]`, pytest
# `Should_*`) runs a `try` block, in its body or in a helper of the same file
# it calls. Tests clean up with framework teardown and check errors with throw
# assertions, so a `try` there hides a failure or skips an assertion. The
# script has no dependencies, so no install step is needed.
on:
  workflow_dispatch:

  pull_request:
    branches:
      - "*"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/test-try-blocks.yml"
      - "scripts/check-test-try-blocks.mjs"
      - "tests/**"
      - "e2e/**"
      - "**/*.test.*"
      - "**/*.spec.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test-try-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🍄 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: 🧪 Check that no test body has a try block
        run: node scripts/check-test-try-blocks.mjs
