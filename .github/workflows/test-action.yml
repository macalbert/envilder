name: 🔑 Key Chest Test

permissions:
  id-token: write # Required for OIDC authentication with AWS
  contents: read

on:
  workflow_dispatch: {}

  pull_request:
    branches:
      - "*"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/test-action.yml"
      - "github-action/action.yml"
      - "src/envilder/apps/gha/**"
      - "src/envilder/apps/shared/**"
      - "src/envilder/core/**"
      - "scripts/build-github-action.mjs"
      - "tests/envilder/apps/gha/**"
      - "e2e/gha.test.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test-action:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15

    steps:
      - name: 🧱 Enter the Pipe (Checkout)
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🍄 Grab a Mushroom (Setup Node.js with Cache)
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: 🪙 Collect Coins (Configure AWS credentials)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📦 Open the ? Block (Install packages)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build the Castle
        run: pnpm build

      - name: 📦 Bundle GitHub Action
        run: pnpm run build:gha

      - name: 🔐 Test Action - Pull Secrets
        uses: ./github-action
        with:
          map-file: e2e/sample/envilder.json
          env-file: .env.test

      - name: ✅ Verify .env file was created
        run: |
          if [ ! -f .env.test ]; then
            echo "❌ .env.test file was not created!"
            exit 1
          fi
          echo "✅ .env.test file created successfully!"
          echo "Contents:"
          cat .env.test

      - name: 🧹 Clean up test file
        if: always()
        run: rm -f .env.test

      - name: 🔐 Test Action - Command (secrets only in this step)
        uses: ./github-action
        with:
          map-file: e2e/sample/envilder.json
          command: test -n "$TOKEN_SECRET" && echo "✅ The command sees TOKEN_SECRET"

      - name: ✅ Verify the command did not export secrets
        run: |
          if [ -n "${TOKEN_SECRET:-}" ]; then
            echo "❌ TOKEN_SECRET leaked to a later step!"
            exit 1
          fi
          echo "✅ TOKEN_SECRET is not visible after the command step"

      - name: 🔐 Test Action - Export to the job environment
        uses: ./github-action
        with:
          map-file: e2e/sample/envilder.json

      - name: ✅ Verify secrets reached later steps
        run: |
          if [ -z "${TOKEN_SECRET:-}" ]; then
            echo "❌ TOKEN_SECRET was not exported!"
            exit 1
          fi
          echo "✅ TOKEN_SECRET is available"
          # .env is gitignored, so git status below would not report it
          if [ -f .env ]; then
            echo "❌ The export left .env in the workspace!"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ The export left files in the workspace:"
            git status --porcelain
            exit 1
          fi
