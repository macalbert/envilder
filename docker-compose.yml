# Development environment: LocalStack for AWS (SSM) and Azure (Key Vault)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#
# AWS SSM endpoint:        http://localhost:4566
# Azure emulator:          https://azure.localhost.localstack.cloud:4567
# Azure Key Vault URLs:    https://<vault>.vault.azure.localhost.localstack.cloud:4567

services:
  localstack:
    image: localstack/localstack:stable
    container_name: envilder-localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required — run pnpx envilder to generate .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack-azure:
    image: localstack/localstack-azure:latest
    container_name: envilder-localstack-azure
    ports:
      - "4567:4567"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required — run pnpx envilder to generate .env}
      # Vault URIs embed the gateway port, so it must match the host port.
      GATEWAY_LISTEN: 0.0.0.0:4567
      LOCALSTACK_HOST: localhost.localstack.cloud:4567
    healthcheck:
      # The Azure image ships without curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4567/_localstack/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
