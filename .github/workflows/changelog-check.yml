name: 📜 Changelog Check

permissions:
  contents: read

# Fails when a PR adds entries to a changelog section whose version is
# already tagged: the release notes are built from the changelog at the tag,
# so those entries would describe code that did not ship. Label the PR
# `changelog-correction` to skip it when fixing an already released section.
# The second job renders the release notes of each component's manifest version
# the same way the publish workflows will, so a missing or broken section fails
# here and not after the merge.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - "docs/changelogs/**"
      - "scripts/check-released-changelogs.mjs"
      - "scripts/release-notes.mjs"
      - "package.json"
      - "src/sdks/nodejs/package.json"
      - "src/sdks/dotnet/Envilder.csproj"
      - "src/sdks/python/pyproject.toml"
      - ".github/workflows/changelog-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  released-sections:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-correction') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📜 Check tagged changelog sections are unchanged
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-released-changelogs.mjs --base="$(git merge-base "origin/$BASE_REF" HEAD)"

  render-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        component:
          - cli
          - sdk-nodejs
          - sdk-dotnet
          - sdk-python
    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📝 Render the release notes of the manifest version (dry run)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            cli) version=$(node -p "require('./package.json').version") ;;
            sdk-nodejs) version=$(node -p "require('./src/sdks/nodejs/package.json').version") ;;
            sdk-dotnet) version=$(grep -oP '<Version>\K[^<]+' src/sdks/dotnet/Envilder.csproj) ;;
            sdk-python) version=$(python3 -c "import tomllib; print(tomllib.load(open('src/sdks/python/pyproject.toml','rb'))['project']['version'])") ;;
          esac
          node scripts/release-notes.mjs --component="$COMPONENT" --version="$version" --dry-run
