name: 🌍 Warp Zone Publisher

on:
  pull_request:
    branches:
      - "*"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "src/website/**"
      - "src/iac/**"
      - "docs/changelogs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-website.yml"

  push:
    branches:
      - main
    paths:
      - "src/website/**"
      - "src/iac/**"
      - "docs/changelogs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-website.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧱 Enter the Pipe (Checkout)
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🍄 Grab a Mushroom (Setup Node.js)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 🪙 Collect Coins (Configure AWS credentials)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 📦 Open the ? Block (Install packages)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build the Castle (Build website)
        working-directory: src/website
        run: pnpm build

      - name: 🔭 Scout the Changes (List changed pages for IndexNow)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        working-directory: src/website
        run: node scripts/indexnow.mjs --out "$RUNNER_TEMP/indexnow-changed.json"

      - name: 🌟 Warp to the Cloud (Deploy infrastructure)
        if: github.event_name != 'pull_request'
        working-directory: src/iac
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cdk.json','utf8'));delete c.profile;fs.writeFileSync('cdk.json',JSON.stringify(c,null,2));"
          npx cdk deploy macalbert-envilder-website-production-stack --require-approval never

      - name: 📯 Blow the Horn (Notify search engines of changed pages)
        if: github.event_name != 'pull_request' && success()
        continue-on-error: true
        timeout-minutes: 2
        working-directory: src/website
        run: |
          if [ -f "$RUNNER_TEMP/indexnow-changed.json" ]; then
            node scripts/indexnow.mjs --in "$RUNNER_TEMP/indexnow-changed.json"
          else
            echo "No changed page list was produced; skipping IndexNow."
          fi

      - name: 🏁 Flagpole Reached!
        run: echo "🎉 Yahoo! Website deployed successfully! ⭐"
