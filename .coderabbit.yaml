# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for envilder
# https://docs.coderabbit.ai/reference/configuration
#
# Conventions live in the repo guideline files (knowledge_base below):
# AGENTS.md, .github/copilot-instructions.md, .github/instructions/ and
# docs/adr/. path_instructions only covers gaps those files leave, so the
# rules are written once. Inspect the resolved config on a PR with
# `@coderabbitai configuration`.

language: en-US
tone_instructions: >-
  Be concise and concrete. When flagging a convention, cite the guideline
  file or ADR it comes from. Skip formatting nits: Biome, dotnet format and
  black/isort enforce style.

reviews:
  profile: "chill"
  # Request changes on blocking findings, approve once every CodeRabbit
  # thread is resolved and no pre-merge check fails. `@coderabbitai approve`
  # also works on demand (allow_author_approval).
  request_changes_workflow: true
  allow_author_approval: true
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  # Labels come from .github/workflows/pr-labeler.yml; reviews from CODEOWNERS.
  suggested_labels: false
  suggested_reviewers: false

  # Exclusions only: any include pattern restricts the review to matching
  # files. Lockfiles, dist/, node_modules/ and images are excluded by default.
  path_filters:
    - "!lib/**"
    - "!coverage/**"
    - "!TestResults/**"
    - "!github-action/dist/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/.venv/**"
    - "!**/*.mp4"
    - "!**/*.gif"

  path_instructions:
    - path: "src/envilder/core/infrastructure/**"
      instructions: |
        Secret values must never reach logs, error messages or exception
        causes in clear text; use EnvironmentVariable.maskedValue.
        Provider SDK errors map to typed domain errors (ADR-0010).
    - path: "src/envilder/apps/**"
      instructions: |
        Code here is bundled into the GitHub Action. A behaviour change must
        come with an updated github-action/dist/index.js (pnpm build:gha);
        CI rejects stale bundles via pnpm verify:gha.

    - path: "src/sdks/dotnet/**"
      instructions: |
        Targets netstandard2.0: no default interface methods, no
        File.ReadAllTextAsync with CancellationToken, no cancelable
        ReadToEndAsync. Package versions go in Directory.Packages.props
        (Central Package Management). ISecretProvider keeps both sync
        GetSecret and async GetSecretAsync.
    - path: "tests/sdks/dotnet/**"
      instructions: |
        xUnit v3: IAsyncLifetime returns ValueTask, not Task. No
        try/catch/finally in tests; clean up with IAsyncLifetime or fixtures.
    - path: "src/sdks/python/**"
      instructions: |
        Synchronous API only (no async/await). Strict mypy
        (disallow_untyped_defs). Public SDK APIs need docstrings with
        examples.
    - path: "src/sdks/{nodejs,python,dotnet}/**"
      instructions: |
        SDKs are independent: no imports from src/envilder or another SDK.
        Public API changes need matching README and website docs updates.

    - path: "src/website/**"
      instructions: |
        Every user-facing string must exist in all i18n locales. Check both
        themes (retro/light) and layouts down to phone width.
    - path: "src/iac/**"
      instructions: |
        AWS CDK. Flag IAM statements with wildcard actions or resources
        unless scoped by a condition.

    - path: ".github/workflows/**"
      instructions: |
        Actions are pinned to version tags and kept current by Dependabot;
        do not ask for SHA pinning. Flag missing or broad `permissions:`,
        pull_request_target, and untrusted input (PR title, branch name,
        issue body) interpolated directly into `run:`.
    - path: "{action.yml,github-action/action.yml}"
      instructions: |
        Public GitHub Action interface: renamed or removed inputs/outputs are
        breaking. README and docs/github-action.md must match.

  tools:
    # Repo linters: Biome (TS), black/isort/mypy (Python). Turn off the
    # overlapping defaults so findings come from one tool per language.
    biome:
      enabled: true
    eslint:
      enabled: false
    oxc:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    ruff:
      enabled: true
    # GitHub Actions and supply chain.
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    osvScanner:
      enabled: true
    # Secret detection: core concern for a secrets tool.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    dotenvLint:
      enabled: true
    # Docs and scripts.
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true

  auto_review:
    enabled: true
    drafts: false
    # Review quota is limited: review on open, re-review on demand with
    # `@coderabbitai review`.
    auto_incremental_review: false
    ignore_title_keywords:
      - "wip"
      - "draft"
    ignore_usernames:
      - "dependabot[bot]"

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        Conventional Commits as enforced by .commitlintrc.json:
        `type(scope): subject`, type one of feat, fix, docs, style, refactor,
        perf, test, chore, ci, build, revert. Subject not upper-case; whole
        title at most 100 characters.
    description:
      mode: warning
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Architecture boundaries"
        mode: warning
        instructions: |
          Fail if any changed file under src/envilder/core/domain/ imports
          from src/envilder/core/application/, src/envilder/core/infrastructure/,
          src/envilder/apps/, an @aws-sdk/* or @azure/* package, inversify,
          node:fs, fs or process.
          Fail if any changed file under src/envilder/core/application/
          imports from src/envilder/core/infrastructure/ or src/envilder/apps/,
          or from an @aws-sdk/* or @azure/* package.
          Pass otherwise. Type-only imports count as imports.
      - name: "Tests accompany code changes"
        mode: warning
        instructions: |
          Consider non-test source files changed under src/envilder/ and
          src/sdks/ (ignore README, *.md, config and generated files).
          Fail if behaviour changes (new or modified logic) and the PR
          changes no file under tests/ or e2e/. Pass for pure renames,
          comments, formatting or type-only changes. Pass when no such
          source file changed.
      - name: "Release coherence"
        mode: warning
        instructions: |
          Applies only when a version field changes in package.json (root),
          src/sdks/nodejs/package.json, src/sdks/python/pyproject.toml,
          src/sdks/dotnet/Envilder.csproj or github-action/action.yml.
          Fail if the same PR adds no changelog entry for that component
          under docs/ (CHANGELOG.md or docs/changelogs/). Pass when no
          version field changed.

  finishing_touches:
    docstrings:
      enabled: false

knowledge_base:
  learnings:
    scope: local
  pull_requests:
    scope: local
  issues:
    scope: local
  code_guidelines:
    enabled: true
    # Guideline files apply only to their own directory tree unless mapped.
    # Defaults (AGENTS.md, copilot-instructions, *.instructions.md, skills)
    # are still picked up; these entries scope them to the code they govern.
    filePatterns:
      - files: ".github/copilot-instructions.md,AGENTS.md,.github/AGENTS.md,CONTEXT.md"
        applyTo: "**"
      - files: ".github/instructions/architecture-boundaries.instructions.md"
        applyTo: "src/envilder/**/*.ts"
      - files: ".github/instructions/coding-and-testing-conventions.instructions.md"
        applyTo: "src/**/*.ts,tests/**/*.ts,e2e/**/*.ts"
      - files: ".github/instructions/release-coherence.instructions.md"
        applyTo: "package.json,src/sdks/**,github-action/action.yml"
      - files: "docs/adr/*.md"
        applyTo: "**"

chat:
  auto_reply: true
