name: 📚 Refresh Context7 Docs

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - ".github/workflows/context7-refresh.yml"
      - "context7.json"
      - "README.md"
      - "docs/**"
      - "github-action/**/*.md"
      - "src/sdks/**/*.md"
      - "examples/**/*.md"

jobs:
  refresh:
    runs-on: ubuntu-26.04

    steps:
      - name: 📚 Trigger Context7 Refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/macalbert/envilder"}')
          cat response.json; echo

          if [ "$status" -lt 300 ]; then
            exit 0
          fi

          # Context7 rate-limits refreshes; a throttled refresh is not a failure
          if grep -q '"too-early"' response.json; then
            echo "::warning::Context7 refresh skipped: $(cat response.json)"
            exit 0
          fi

          exit 1
