name: 🔒 Verify Actions Lockfile

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/**"
      - "action.yml"
      - "github-action/action.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  verify-actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧱 Checkout
        uses: actions/checkout@v7

      - name: 📦 Install gh-actions-lock
        # Keep this version in step with the install docs in CONTRIBUTING.md
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🔍 Verify actions.lock
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
