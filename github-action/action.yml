name: "Envilder GitHub Action"
description: "Load secrets from AWS SSM or Azure Key Vault into your CI/CD job environment, a single command, or a .env file"
author: "macalbert"

branding:
  icon: "lock"
  color: "orange"

inputs:
  map-file:
    description: "Path to the JSON file mapping environment variables to secret paths"
    required: true
  env-file:
    description: "Optional. Path to a .env file to write the secrets to, for tools that need a file. Without env-file or command, secrets are exported to the environment of the later steps of the job."
    required: false
  command:
    description: "Optional. Command to run (with bash) with the secrets in its environment. The secrets exist only for this command, not for the later steps of the job. Cannot be combined with env-file."
    required: false
  provider:
    description: "Cloud provider to use: aws or azure (default: aws). Can also be set via $config.provider in the map file."
    required: false
  vault-url:
    description: "Azure Key Vault URL (overrides $config.vaultUrl in map file)"
    required: false

outputs:
  env-file-path:
    description: "Path to the generated .env file (empty unless env-file is set)"
    value: ${{ inputs.env-file }}

runs:
  using: "composite"
  steps:
    - name: 🍄 Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "22.x"

    - name: 🔐 Load secrets
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_MAP_FILE: ${{ inputs.map-file }}
        INPUT_ENV_FILE: ${{ inputs.env-file }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_VAULT_URL: ${{ inputs.vault-url }}
      run: |
        node "${{ github.action_path }}/dist/index.js"
