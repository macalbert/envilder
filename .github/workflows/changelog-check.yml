name: 📜 Changelog Check

permissions:
  contents: read

# Fails when a PR adds entries to a changelog section whose version is
# already tagged: the release notes are built from the changelog at the tag,
# so those entries would describe code that did not ship. Label the PR
# `changelog-correction` to skip it when fixing an already released section.
# The second job renders the latest section of each changed changelog the same
# way the publish workflows will, so a broken section fails here and not after
# the merge.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - "docs/changelogs/**"
      - "scripts/check-released-changelogs.mjs"
      - "scripts/release-notes.mjs"
      - ".github/workflows/changelog-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  released-sections:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-correction') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📜 Check tagged changelog sections are unchanged
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-released-changelogs.mjs --base="$(git merge-base "origin/$BASE_REF" HEAD)"

  render-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: cli
            file: cli.md
          - component: sdk-nodejs
            file: sdk-nodejs.md
          - component: sdk-dotnet
            file: sdk-dotnet.md
          - component: sdk-python
            file: sdk-python.md
    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📝 Render the latest release notes (dry run)
        env:
          BASE_REF: ${{ github.base_ref }}
          FILE: docs/changelogs/${{ matrix.file }}
          COMPONENT: ${{ matrix.component }}
        run: |
          if git diff --quiet "origin/$BASE_REF"...HEAD -- "$FILE"; then
            echo "$FILE is unchanged, nothing to render"
            exit 0
          fi
          version=$(grep -m1 -oP '^## \[\K[^\]]+' "$FILE")
          node scripts/release-notes.mjs --component="$COMPONENT" --version="$version" --dry-run
