name: 🔍 Verify Action Build

permissions:
  contents: read

on:
  pull_request:

jobs:
  # No `paths:` filter here on purpose: a required check gated by a
  # workflow-level `paths:` filter never posts a status when skipped and
  # blocks merging forever. A job-level `if:` skip reports "success"
  # instead, so the path check moves here and gates verify-build below.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.filter.outputs.action }}
    steps:
      - name: 🧱 Checkout
        uses: actions/checkout@v7
      - name: 🔍 Detect relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            action:
              - "src/envilder/apps/gha/**"
              - "github-action/**"
              - "scripts/build-github-action.mjs"
              - ".github/workflows/verify-action-build.yml"
              # Dependency bumps change the bundle too
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  verify-build:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.action == 'true' }}
    timeout-minutes: 10

    steps:
      - name: 🧱 Checkout
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🍄 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Verify build is up to date
        run: pnpm verify:gha
