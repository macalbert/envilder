pre-commit:
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc,astro,mjs}"
      exclude: "github-action/dist/index.js"
      run: >-
        pnpm exec biome check --write --unsafe --no-errors-on-unmatched {staged_files} &&
        pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    actions-lockfile:
      # Default staged files leave out deletions; a removed workflow must
      # still trigger the check
      files: git diff --cached --name-only
      glob:
        - ".github/workflows/*.{yml,yaml,lock}"
        - "**/action.{yml,yaml}"
      run: node scripts/check-actions-lockfile.mjs
    docs-dates:
      glob: "src/website/src/**"
      run: >-
        pnpm docs:dates &&
        git add src/website/src/i18n/docs-dates.json
    dotnet-format:
      glob: "**/*.{cs,csproj}"
      run: dotnet format src/sdks/dotnet/Envilder.sln --include {staged_files}
      stage_fixed: true
    python-format-src:
      glob: "src/sdks/python/**/*.py"
      run: >-
        uv run --project src/sdks/python black {staged_files} &&
        uv run --project src/sdks/python isort {staged_files} &&
        uv run --project src/sdks/python mypy src/sdks/python/envilder/
      stage_fixed: true
    python-format-tests:
      glob: "tests/sdks/python/**/*.py"
      run: >-
        uv run --project src/sdks/python black {staged_files} &&
        uv run --project src/sdks/python isort {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpx commitlint --edit {1}
